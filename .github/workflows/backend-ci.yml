name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Run Pytest Backend Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install CPU PyTorch and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          # Fast CPU-only wheels for PyTorch and torchvision
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          # Core web, image processing, test, and reporting packages
          pip install Flask Flask-CORS flask-socketio Pillow opencv-python-headless numpy requests Werkzeug pydicom scipy fpdf2 pytest

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          python -m pytest -v
